<title>Chalkboard Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  :root {
    --wood-hi: #8a5f3c;
    --wood-lo: #55371f;
    --board: #1d2e26;
    --board-edge: #14231b;
    --chalk: #eef1ea;
    --chalk-dim: #b9c4bc;
    --chalk-x: #ef8c6d;
    --chalk-o: #7ec9e0;
    --chalk-win: #f2d94e;
    --felt-new: #4a6a63;
    --felt-reset: #7a4a3f;
    --wall: #11170f;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--wall);
    color: var(--chalk);
    font-family: 'Rubik', ui-sans-serif, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% 100%, rgba(0,0,0,.5), transparent 70%);
  }

  .board-frame {
    width: 100%;
    max-width: 440px;
    padding: 16px;
    border-radius: 8px;
    background: linear-gradient(160deg, var(--wood-hi), var(--wood-lo));
    box-shadow:
      0 24px 48px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.15),
      inset 0 -3px 6px rgba(0,0,0,.35);
    background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.08) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, var(--wood-hi), var(--wood-lo));
  }

  .chalkboard {
    position: relative;
    background: var(--board);
    border-radius: 4px;
    padding: 22px 22px 18px;
    box-shadow: inset 0 0 0 1px var(--board-edge), inset 0 10px 30px rgba(0,0,0,.5);
    overflow: hidden;
    background-image:
      radial-gradient(circle at 8% 15%, rgba(255,255,255,.035) 0 1px, transparent 1.2px),
      radial-gradient(circle at 82% 62%, rgba(255,255,255,.03) 0 1.4px, transparent 1.6px),
      radial-gradient(circle at 45% 88%, rgba(255,255,255,.03) 0 1px, transparent 1.2px),
      radial-gradient(circle at 65% 22%, rgba(255,255,255,.025) 0 1px, transparent 1.2px),
      radial-gradient(circle at 25% 70%, rgba(255,255,255,.03) 0 1.3px, transparent 1.4px),
      var(--board);
    background-size: 47px 47px, 63px 63px, 39px 39px, 71px 71px, 53px 53px, auto;
  }

  .corner-note {
    position: absolute;
    top: 10px;
    right: 16px;
    font-family: 'Kalam', cursive;
    font-size: 12px;
    color: var(--chalk-dim);
    transform: rotate(-3deg);
    letter-spacing: .02em;
  }

  header.head {
    text-align: center;
    margin-bottom: 14px;
  }

  .eyebrow {
    font-family: 'Rubik', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    opacity: .8;
  }

  h1 {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 40px);
    margin: 2px 0 2px;
    letter-spacing: .01em;
    text-wrap: balance;
    color: var(--chalk);
    text-shadow: 0 0 1px rgba(238,241,234,.25);
  }

  .tagline {
    font-family: 'Kalam', cursive;
    font-size: 15px;
    color: var(--chalk-dim);
    transform: rotate(-0.6deg);
  }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 10px;
    margin: 16px 4px 18px;
  }

  .score-cell {
    text-align: center;
  }

  .score-cell .label {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--chalk-dim);
    margin-bottom: 2px;
  }

  .score-cell.x .label { color: var(--chalk-x); }
  .score-cell.o .label { color: var(--chalk-o); }

  .score-cell .num {
    font-family: 'Kalam', cursive;
    font-size: 34px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .score-cell.x .num { color: var(--chalk-x); }
  .score-cell.o .num { color: var(--chalk-o); }

  .score-cell.draw .num { font-size: 22px; color: var(--chalk-dim); }
  .score-cell.draw .label { font-size: 10px; }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 300px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .board-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .cells {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .cell {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .cell:focus-visible {
    outline: 2px dashed var(--chalk);
    outline-offset: -6px;
    border-radius: 4px;
  }

  .cell:disabled { cursor: default; }

  .mark { transform-box: fill-box; transform-origin: center; }

  @media (prefers-reduced-motion: no-preference) {
    .mark.pop { animation: pop .24s ease-out; }
    .winline.pop { animation: strike .3s ease-out; }
  }

  @keyframes pop {
    0% { opacity: 0; transform: scale(.35); }
    70% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes strike {
    0% { opacity: 0; stroke-dashoffset: 1; }
    100% { opacity: 1; stroke-dashoffset: 0; }
  }

  .status {
    text-align: center;
    font-family: 'Kalam', cursive;
    font-size: 19px;
    color: var(--chalk);
    min-height: 28px;
    margin: 16px 0 2px;
  }

  .chalk-tray {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(180deg, var(--wood-lo), var(--wood-hi));
    box-shadow: inset 0 3px 6px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.08);
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .eraser {
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: .02em;
    color: var(--chalk);
    border: none;
    border-radius: 3px;
    padding: 0;
    cursor: pointer;
    width: 128px;
    overflow: hidden;
    box-shadow: 0 3px 0 rgba(0,0,0,.3), 0 5px 8px rgba(0,0,0,.35);
    transition: transform .08s ease;
  }

  .eraser:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }

  .eraser:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

  .eraser .wood-cap {
    display: block;
    height: 6px;
    background: linear-gradient(180deg, #c9a06a, #9c723f);
  }

  .eraser .felt {
    display: block;
    padding: 9px 6px;
    text-align: center;
  }

  .eraser.new .felt { background: var(--felt-new); }
  .eraser.reset .felt { background: var(--felt-reset); }

  @media (max-width: 380px) {
    .board-frame { padding: 12px; }
    .chalkboard { padding: 18px 14px 14px; }
    .eraser { width: 44%; }
  }
</style>

<div class="board-frame">
  <div class="chalkboard">
    <div class="corner-note">Rm. 3B &middot; no. 2 chalk only</div>
    <header class="head">
      <div class="eyebrow">Two players &middot; one board</div>
      <h1>Tic&nbsp;&middot;&nbsp;Tac&nbsp;&middot;&nbsp;Toe</h1>
      <div class="tagline">winner rubs it out</div>
    </header>

    <div class="scoreboard">
      <div class="score-cell x">
        <div class="label">X</div>
        <div class="num" id="scoreX">0</div>
      </div>
      <div class="score-cell draw">
        <div class="label">Draws</div>
        <div class="num" id="scoreDraw">0</div>
      </div>
      <div class="score-cell o">
        <div class="label">O</div>
        <div class="num" id="scoreO">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <filter id="chalkTexture" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6"/>
          </filter>
        </defs>
        <g stroke="var(--chalk)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#chalkTexture)">
          <path d="M 101 14 C 99 90, 103 200, 99 288"></path>
          <path d="M 201 12 C 203 100, 198 210, 202 286"></path>
          <path d="M 14 101 C 90 98, 210 104, 288 99"></path>
          <path d="M 12 201 C 100 203, 200 197, 288 202"></path>
        </g>
        <g id="marks"></g>
        <g id="winline"></g>
      </svg>
      <div class="cells" id="cells"></div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">X's turn</p>
  </div>

  <div class="chalk-tray">
    <button class="eraser new" id="newRoundBtn" type="button">
      <span class="wood-cap"></span>
      <span class="felt">New Round</span>
    </button>
    <button class="eraser reset" id="resetScoreBtn" type="button">
      <span class="wood-cap"></span>
      <span class="felt">Reset Score</span>
    </button>
  </div>
</div>

<script>
(function () {
  var LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  var STORAGE_KEY = 'chalkboard-ttt-scores-v1';

  var game = {
    board: Array(9).fill(null),
    current: 'X',
    startPlayer: 'X',
    over: false,
    winLine: null,
    scores: { X: 0, O: 0, draw: 0 }
  };

  var cellsEl = document.getElementById('cells');
  var marksEl = document.getElementById('marks');
  var winlineEl = document.getElementById('winline');
  var statusEl = document.getElementById('status');
  var scoreXEl = document.getElementById('scoreX');
  var scoreOEl = document.getElementById('scoreO');
  var scoreDrawEl = document.getElementById('scoreDraw');

  var cellButtons = [];

  function cellCenter(i) {
    var col = i % 3, row = Math.floor(i / 3);
    return { x: col * 100 + 50, y: row * 100 + 50 };
  }

  function jitter(i, amount) {
    return ((i * 53) % 11 - 5) / 5 * amount;
  }

  function loadScores() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (typeof s.X === 'number' && typeof s.O === 'number' && typeof s.draw === 'number') {
          game.scores = s;
        }
      }
    } catch (e) {}
  }

  function saveScores() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(game.scores)); } catch (e) {}
  }

  function buildCells() {
    cellsEl.innerHTML = '';
    cellButtons = [];
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var btn = document.createElement('button');
        btn.className = 'cell';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Row ' + (Math.floor(idx / 3) + 1) + ', column ' + (idx % 3 + 1) + ', empty');
        btn.addEventListener('click', function () { playCell(idx); });
        cellsEl.appendChild(btn);
        cellButtons.push(btn);
      })(i);
    }
  }

  function svgNS(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

  function drawMark(i, type) {
    var c = cellCenter(i);
    var g = svgNS('g');
    g.setAttribute('class', 'mark pop');
    g.setAttribute('filter', 'url(#chalkTexture)');
    var rot = jitter(i, 6);
    g.setAttribute('transform', 'rotate(' + rot + ' ' + c.x + ' ' + c.y + ')');

    if (type === 'X') {
      var p1 = svgNS('path');
      p1.setAttribute('d', 'M ' + (c.x - 30) + ' ' + (c.y - 30) + ' L ' + (c.x + 30) + ' ' + (c.y + 30));
      var p2 = svgNS('path');
      p2.setAttribute('d', 'M ' + (c.x + 30) + ' ' + (c.y - 30) + ' L ' + (c.x - 30) + ' ' + (c.y + 30));
      [p1, p2].forEach(function (p) {
        p.setAttribute('stroke', 'var(--chalk-x)');
        p.setAttribute('stroke-width', '9');
        p.setAttribute('stroke-linecap', 'round');
        g.appendChild(p);
      });
    } else {
      var o = svgNS('ellipse');
      o.setAttribute('cx', c.x);
      o.setAttribute('cy', c.y);
      o.setAttribute('rx', 32);
      o.setAttribute('ry', 34);
      o.setAttribute('fill', 'none');
      o.setAttribute('stroke', 'var(--chalk-o)');
      o.setAttribute('stroke-width', '9');
      g.appendChild(o);
    }
    marksEl.appendChild(g);
  }

  function drawWinLine(line) {
    var a = cellCenter(line[0]);
    var b = cellCenter(line[2]);
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ext = 26;
    var ux = dx / len, uy = dy / len;
    var sx = a.x - ux * ext, sy = a.y - uy * ext;
    var ex = b.x + ux * ext, ey = b.y + uy * ext;
    var path = svgNS('path');
    path.setAttribute('class', 'winline pop');
    path.setAttribute('d', 'M ' + sx + ' ' + sy + ' L ' + ex + ' ' + ey);
    path.setAttribute('stroke', 'var(--chalk-win)');
    path.setAttribute('stroke-width', '7');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('fill', 'none');
    path.setAttribute('filter', 'url(#chalkTexture)');
    winlineEl.appendChild(path);
  }

  function checkResult(board) {
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i];
      if (board[l[0]] && board[l[0]] === board[l[1]] && board[l[1]] === board[l[2]]) {
        return { winner: board[l[0]], line: l };
      }
    }
    if (board.every(function (c) { return c; })) return { winner: null, line: null, draw: true };
    return null;
  }

  function setStatus(text) { statusEl.textContent = text; }

  function updateScoreDisplay() {
    scoreXEl.textContent = game.scores.X;
    scoreOEl.textContent = game.scores.O;
    scoreDrawEl.textContent = game.scores.draw;
  }

  function playCell(idx) {
    if (game.over || game.board[idx]) return;
    game.board[idx] = game.current;
    drawMark(idx, game.current);
    cellButtons[idx].disabled = true;
    cellButtons[idx].setAttribute('aria-label',
      'Row ' + (Math.floor(idx / 3) + 1) + ', column ' + (idx % 3 + 1) + ', ' + game.current);

    var result = checkResult(game.board);
    if (result && result.winner) {
      game.over = true;
      game.winLine = result.line;
      drawWinLine(result.line);
      game.scores[result.winner]++;
      updateScoreDisplay();
      saveScores();
      setStatus(result.winner + ' wins the round');
      disableAllCells();
    } else if (result && result.draw) {
      game.over = true;
      game.scores.draw++;
      updateScoreDisplay();
      saveScores();
      setStatus("It's a draw");
    } else {
      game.current = game.current === 'X' ? 'O' : 'X';
      setStatus(game.current + "'s turn");
    }
  }

  function disableAllCells() {
    cellButtons.forEach(function (b) { b.disabled = true; });
  }

  function newRound() {
    game.board = Array(9).fill(null);
    game.over = false;
    game.winLine = null;
    game.startPlayer = game.startPlayer === 'X' ? 'O' : 'X';
    game.current = game.startPlayer;
    marksEl.innerHTML = '';
    winlineEl.innerHTML = '';
    buildCells();
    setStatus(game.current + "'s turn");
  }

  function resetScore() {
    game.scores = { X: 0, O: 0, draw: 0 };
    updateScoreDisplay();
    saveScores();
    newRound();
  }

  document.getElementById('newRoundBtn').addEventListener('click', newRound);
  document.getElementById('resetScoreBtn').addEventListener('click', resetScore);

  function renderFromState() {
    marksEl.innerHTML = '';
    winlineEl.innerHTML = '';
    buildCells();
    game.board.forEach(function (mark, i) {
      if (mark) {
        drawMark(i, mark);
        cellButtons[i].disabled = true;
        cellButtons[i].setAttribute('aria-label',
          'Row ' + (Math.floor(i / 3) + 1) + ', column ' + (i % 3 + 1) + ', ' + mark);
      }
    });
    if (game.winLine) {
      drawWinLine(game.winLine);
      disableAllCells();
    }
    if (game.over) {
      if (game.winLine) {
        setStatus(game.board[game.winLine[0]] + ' wins the round');
      } else {
        setStatus("It's a draw");
      }
    } else {
      setStatus(game.current + "'s turn");
    }
    updateScoreDisplay();
  }

  function start(initial) {
    loadScores();
    if (initial && Array.isArray(initial.board)) {
      game.board = initial.board;
      game.current = initial.current || 'X';
      game.startPlayer = initial.startPlayer || 'X';
      game.over = !!initial.over;
      game.winLine = initial.winLine || null;
      if (initial.scores) game.scores = initial.scores;
    }
    renderFromState();
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () { return game; });
    if (window.claude.hot.ready) {
      window.claude.hot.ready(start);
    } else {
      start(window.claude.hot.data);
    }
  } else {
    start(null);
  }
})();
</script>
